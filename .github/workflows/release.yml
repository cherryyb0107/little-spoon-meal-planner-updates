name: Build and publish Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build renderer
        working-directory: desktop
        run: npm run build:renderer
      - name: Publish release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          npx electron-builder --win nsis --publish never
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $installer = Get-ChildItem release -Filter "*설치-$version-x64.exe" | Where-Object { $_.Name -notlike '*uninstaller*' } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer for version $version was not created." }
          $asset = "little-spoon-meal-planner-setup-$version.exe"
          Copy-Item $installer.FullName "release/$asset"
          Copy-Item "$($installer.FullName).blockmap" "release/$asset.blockmap"
          gh release create $env:GITHUB_REF_NAME `
            "release/$asset" `
            "release/$asset.blockmap" `
            "release/latest.yml" `
            --title $version `
            --notes "작은 한 끼 $version 자동 업데이트"
